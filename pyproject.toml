[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "afrm"
version = "0.1.0"
description = "Prototype Aircraft Fuel and Range Management tool using simulated data. Not for operational use."
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "hypothesis>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "bandit>=1.8",
    "pip-audit>=2.7",
    "build>=1.2",
]

[project.scripts]
afrm = "afrm.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/afrm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["afrm"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "C4", "SIM", "RET", "PL"]
ignore = ["PLR2004", "PLR0913", "PLR0917"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S311"]
"src/afrm/simulation.py" = ["S311"]
"scripts/*" = ["S603", "S607", "S311"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B311"]