# Operational criteria. 
schema_version = 1


[planning]
contingency_fraction = 0.05    # 5 % of trip fuel...
contingency_floor_min = 5.0    # ,,but never less than 5 min holding
final_reserve_min = 30.0       # 30 min holding (turbine aeroplanes)

[dispatch]
marginal_fraction = 0.02       # Project rule: margin under 2 % of required is MARGINAL

[inflight]
min_fuel_buffer_min = 10.0     # Project rule: the delay "any change to the clearance" could cause.
burn_window_segments = 3       #  Recent segments used to estimate burn.
burn_min_segments = 2          # with fewer than this, trust the model.
discrepancy_ratio = 1.08       # burn 8 % above model raises a flag.
noise_band_fraction = 0.005    # excess within 0.5 % of capacity is treated as gauge noise.
fob_high_tolerance_fraction = 0.02  # A reading this far above prediction is rejected.
invalid_escalation_count = 2   # Bad readings in a row that force at least CAUTION.